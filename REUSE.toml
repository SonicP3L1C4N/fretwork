version = 1
SPDX-PackageName = "fretwork"
SPDX-PackageSupplier = "Gary Bissett <gary.bissett@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/SonicP3L1C4N/fretwork"

[[annotations]]
path = ["docs/**", "icons/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Bissett <gary.bissett@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-only OR GPL-3.0-only OR LicenseRef-KDE-Accepted-GPL"

# Source Serif 4, vendored unmodified for the chrome. Adobe's, not this
# project's, and under a different licence from everything above -- which is
# the whole reason this block exists rather than the files being swept up by
# the one above it.
[[annotations]]
path = ["fonts/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2014-2023 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'"
SPDX-License-Identifier = "OFL-1.1"

# The licence texts themselves carry no headers, by REUSE's own convention.
[[annotations]]
path = "LICENSES/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Bissett <gary.bissett@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-only OR GPL-3.0-only OR LicenseRef-KDE-Accepted-GPL"

# The test and evaluation agents. A Claude Code agent file must open with its
# YAML frontmatter on the first line, so there is nowhere in them to put a
# header -- which is what this file is for.
[[annotations]]
path = ".claude/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Bissett <gary.bissett@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-only OR GPL-3.0-only OR LicenseRef-KDE-Accepted-GPL"

# The AUR's generated metadata. .SRCINFO has no comment syntax at all -- every
# line is a key and a value -- so there is nowhere in it to put a header, and
# makepkg rewrites it whole from the PKGBUILD anyway.
[[annotations]]
path = "packaging/aur/.SRCINFO"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Bissett <gary.bissett@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-only OR GPL-3.0-only OR LicenseRef-KDE-Accepted-GPL"

# Cargo's lock file. It is generated, and cargo rewrites it whole, so a header
# put in it would be removed by the next build that touched a dependency --
# which is exactly the kind of file this mechanism exists for.
[[annotations]]
path = "rust/**/Cargo.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Bissett <gary.bissett@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-only OR GPL-3.0-only OR LicenseRef-KDE-Accepted-GPL"
